name: Deploy to Tencent CloudBase

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CloudBase CLI
        # 固定 3.7.0（2026-09-15 收口）：3.8.1 的源码部署请求被云托管连续 5 次 400 拒绝，
        # 同包同环境本机 3.7.0 秒过（版本 107 实证）。勿随意升级 CLI 版本。
        run: npm install -g @cloudbase/cli@3.7.0

      - name: Login to CloudBase
        run: tcb login --apiKeyId ${{ secrets.TCB_SECRET_ID }} --apiKey ${{ secrets.TCB_SECRET_KEY }}

      - name: Deploy to Cloud Run (auto-retry 3x for intermittent tcb 400)
        # 3.7.0 无 --env-id/--yes 参数；环境用 tcb env use 指定。
        # 部署命令带"是否灰度发布"确认题，用 yes "" 自动回车选默认 No（23:49 本机实测通过）。
        run: |
          tcb env use ${{ secrets.TCB_ENV_ID }}
          for i in 1 2 3; do
            echo "===== 第 $i/3 次尝试部署 ====="
            if yes "" | tcb cloudrun deploy \
              -s doudizhu-game \
              --port 8080 \
              --force; then
              echo "===== 部署成功 ====="
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              echo "===== 第 $i 次失败，60 秒后重试 ====="
              sleep 60
            fi
          done
          echo "===== 三次尝试均失败，部署终止 ====="
          exit 1

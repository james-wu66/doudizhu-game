name: Deploy to Tencent CloudBase

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Login to CloudBase
        run: tcb login --apiKeyId ${{ secrets.TCB_SECRET_ID }} --apiKey ${{ secrets.TCB_SECRET_KEY }}

      - name: Deploy to Cloud Run
        run: echo "No" | tcb cloudrun deploy --env-id ${{ secrets.TCB_ENV_ID }} --service-name doudizhu-game --force --envParams "DB_HOST=172.17.0.2&DB_PORT=3306&DB_USER=doudizhu_game&DB_PASSWORD=${{ secrets.DB_PASSWORD }}&DB_NAME=james-wu-d2gcojd404e6b8137&PORT=80"

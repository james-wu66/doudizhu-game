name: Deploy to Tencent CloudBase

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli@3.8.1

      - name: Login to CloudBase
        run: tcb login --apiKeyId ${{ secrets.TCB_SECRET_ID }} --apiKey ${{ secrets.TCB_SECRET_KEY }}

      - name: Deploy to Cloud Run (auto-retry 3x for intermittent tcb 400)
        run: |
          for i in 1 2 3; do
            echo "===== 第 $i/3 次尝试部署 ====="
            if printf "No\nY\n" | tcb cloudrun deploy \
              --env-id ${{ secrets.TCB_ENV_ID }} \
              --service-name doudizhu-game \
              --port 8080 \
              --force \
              --yes; then
              echo "===== 部署成功 ====="
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              echo "===== 第 $i 次失败，60 秒后重试 ====="
              sleep 60
            fi
          done
          echo "===== 三次尝试均失败，部署终止 ====="
          exit 1

name: Deploy to Tencent CloudBase

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CloudBase CLI
        # 固定 3.7.0（2026-09-15 收口）：3.8.1 的源码部署请求被云托管连续 5 次 400 拒绝，
        # 同包同环境本机 3.7.0 秒过（版本 107 实证）。勿随意升级 CLI 版本。
        run: npm install -g @cloudbase/cli@3.7.0

      - name: Login to CloudBase
        run: tcb login --apiKeyId ${{ secrets.TCB_SECRET_ID }} --apiKey ${{ secrets.TCB_SECRET_KEY }}

      - name: Deploy to Cloud Run (single attempt, no retry)
        # 2026-09-15 收口：400 根因=腾讯云拒收 GitHub Actions 出口 IP（登录成功、
        # 仅部署步被拒；三次重试 0 成功实证），重试无意义，砍成单次失败即停
        # （约 4 分钟），红了由本机 tcb 补部署。3.7.0 无 --env-id/--yes 参数；
        # 环境用 tcb env use 指定。部署命令带"是否灰度发布"确认题，用 yes "" 自动回车。
        run: |
          tcb env use ${{ secrets.TCB_ENV_ID }}
          yes "" | tcb cloudrun deploy \
            -s doudizhu-game \
            --port 8080 \
            --force

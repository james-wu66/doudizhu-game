<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欢乐斗地主</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { 
    height:100vh; display:flex; align-items:center; justify-content:center;
    background: #f8fafc; font-family: 'Microsoft YaHei', sans-serif;
}
.container { display:flex; width:800px; border-radius:24px; overflow:hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.08); }

.left {
    width:360px; padding:60px 40px;
    background: linear-gradient(160deg, #1e3a5f, #2c5282);
    color:white; display:flex; flex-direction:column; justify-content:center;
}
.left h1 { font-size:32px; font-weight:800; margin-bottom:16px; }
.left p { font-size:15px; opacity:0.85; line-height:1.8; }
.left .features { margin-top:30px; }
.left .features div { display:flex; align-items:center; gap:10px; margin-bottom:14px; font-size:14px; opacity:0.9; }
.left .features span { font-size:20px; }

.right { flex:1; padding:60px 50px; background:white; }
.right h2 { color:#1e293b; font-size:22px; margin-bottom:8px; }
.right .subtitle { color:#94a3b8; font-size:14px; margin-bottom:35px; }

.input-group { margin-bottom:20px; }
.input-group label { display:block; color:#475569; font-size:13px; margin-bottom:8px; font-weight:500; }
.input-group input {
    width:100%; padding:13px 16px; border-radius:10px; border:1.5px solid #e2e8f0;
    background: #f8fafc; color:#1e293b; font-size:14px; outline:none; transition:all 0.3s;
}
.input-group input:focus { border-color:#1e3a5f; box-shadow:0 0 0 3px rgba(30,58,95,0.1); }

.btn {
    width:100%; padding:14px; border:none; border-radius:10px;
    background: linear-gradient(135deg, #1e3a5f, #2c5282);
    color:white; font-size:15px; font-weight:600; cursor:pointer;
    letter-spacing:2px; margin-top:8px; transition:all 0.3s;
}
.btn:hover { transform:translateY(-1px); box-shadow:0 8px 25px rgba(30,58,95,0.25); }
.btn:active { transform:translateY(0); }

.links { display:flex; justify-content:space-between; margin-top:20px; }
.links a { color:#94a3b8; font-size:13px; text-decoration:none; cursor:pointer; }
.links a:hover { color:#1e3a5f; }

.checkbox { display:flex; align-items:center; gap:8px; margin-top:12px; }
.checkbox input { accent-color:#1e3a5f; }
.checkbox label { color:#94a3b8; font-size:13px; cursor:pointer; }

.msg { margin-top:15px; padding:10px 14px; border-radius:8px; font-size:13px; display:none; }
.msg.error { display:block; background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }
.msg.success { display:block; background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0; }

.loading { opacity:0.6; pointer-events:none; }
</style>
</head>
<body>
<div class="container">
    <div class="left">
        <h1>🃏 欢乐斗地主</h1>
        <p>经典扑克游戏，智能AI对手，随时随地畅玩</p>
        <div class="features">
            <div><span>🎮</span> 经典玩法，原汁原味</div>
            <div><span>🤖</span> 智能AI，越打越强</div>
            <div><span>📊</span> 战绩统计，一目了然</div>
            <div><span>🏆</span> 排行榜，群雄争霸</div>
        </div>
    </div>
    <div class="right">
        <h2 id="formTitle">欢迎回来</h2>
        <p class="subtitle" id="formSubtitle">登录你的账号开始游戏</p>
        
        <div class="input-group">
            <label>名字</label>
            <input type="text" id="nameInput" placeholder="输入你的名字" autocomplete="username">
        </div>
        <div class="input-group">
            <label>密码</label>
            <input type="password" id="passwordInput" placeholder="输入密码（至少4位）" autocomplete="current-password">
        </div>
        <div class="checkbox">
            <input type="checkbox" id="remember" checked>
            <label for="remember">记住我</label>
        </div>
        <button class="btn" id="submitBtn" onclick="handleSubmit()">登 录</button>
        <div class="msg" id="msg"></div>
        <div class="links">
            <a onclick="toggleMode()" id="toggleLink">新用户注册</a>
            <a onclick="forgotPassword()">忘记密码？</a>
        </div>
    </div>
</div>

<script>
const API = 'http://localhost:5000/api';
let isRegister = false;

// 页面加载时尝试自动登录
window.onload = function() {
    const token = localStorage.getItem('doudizhu_token');
    const name = localStorage.getItem('doudizhu_name');
    if (token && name) {
        autoLogin(token, name);
    }
};

async function autoLogin(token, name) {
    try {
        const resp = await fetch(API + '/auto-login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({token: token})
        });
        const data = await resp.json();
        if (data.success) {
            goToLobby(data.name);
        }
    } catch(e) {
        // 自动登录失败，显示登录界面
    }
}

function toggleMode() {
    isRegister = !isRegister;
    document.getElementById('formTitle').textContent = isRegister ? '创建账号' : '欢迎回来';
    document.getElementById('formSubtitle').textContent = isRegister ? '注册新账号开始游戏' : '登录你的账号开始游戏';
    document.getElementById('submitBtn').textContent = isRegister ? '注 册' : '登 录';
    document.getElementById('toggleLink').textContent = isRegister ? '已有账号？登录' : '新用户注册';
    hideMsg();
}

async function handleSubmit() {
    const name = document.getElementById('nameInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const remember = document.getElementById('remember').checked;
    
    if (!name) { showMsg('请输入名字', 'error'); return; }
    if (!password || password.length < 4) { showMsg('密码至少4位', 'error'); return; }
    
    const endpoint = isRegister ? '/register' : '/login';
    const btn = document.getElementById('submitBtn');
    btn.classList.add('loading');
    btn.textContent = '请稍候...';
    
    try {
        const resp = await fetch(API + endpoint, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: name, password: password})
        });
        const data = await resp.json();
        
        if (data.success) {
            if (remember) {
                localStorage.setItem('doudizhu_token', data.token);
                localStorage.setItem('doudizhu_name', data.name);
            }
            showMsg((isRegister ? '注册' : '登录') + '成功！', 'success');
            setTimeout(() => goToLobby(data.name), 500);
        } else {
            showMsg(data.error || '操作失败', 'error');
        }
    } catch(e) {
        showMsg('网络错误，请检查后端是否启动', 'error');
    }
    
    btn.classList.remove('loading');
    btn.textContent = isRegister ? '注 册' : '登 录';
}

function goToLobby(name) {
    window.location.href = 'lobby.html?name=' + encodeURIComponent(name);
}

function showMsg(text, type) {
    const msg = document.getElementById('msg');
    msg.textContent = text;
    msg.className = 'msg ' + type;
}

function hideMsg() {
    document.getElementById('msg').className = 'msg';
}

function forgotPassword() {
    showMsg('请联系管理员重置密码', 'error');
}

// 回车键提交
document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleSubmit();
});
</script>
</body>
</html>

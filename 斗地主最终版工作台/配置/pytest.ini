[pytest]
# Pytest配置文件
# 用于后端Python测试

# 测试目录
testpaths = tests

# 测试文件发现规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试选项
addopts = 
    --verbose 
    --tb=short
    --strict-markers
    --disable-warnings

# 覆盖率配置
addopts = 
    --verbose 
    --tb=short
    --cov=backend
    --cov-report=term-missing
    --cov-report=html:coverage_report

# 标记
markers =
    slow: 标记慢速测试
    integration: 标记集成测试
    unit: 标记单元测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S